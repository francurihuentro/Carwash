[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carwash-agenda"
version = "0.1.0a1"
description = "Agenda visual de servicios CarWash con Python, MVC y JSON"
requires-python = ">=3.10"

[project.scripts]
carwash = "carwash.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
